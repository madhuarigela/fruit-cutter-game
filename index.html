<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101020">
<meta name="description" content="Fruit Rush — slice fruit, chain combos and beat your high score.">
<title>Fruit Rush — Slice Arcade</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<style>
:root{font-family:Inter,ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101020}
body{min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% -10%,#403064 0,#19192f 38%,#090d19 100%);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(2px);pointer-events:none;z-index:0}
body:before{width:260px;height:260px;top:10%;left:-140px;background:#ff7d4b12}body:after{width:300px;height:300px;right:-180px;bottom:8%;background:#a58cff12}
.shell{width:min(100%,520px);position:relative;z-index:1}
.header{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px;padding:0 6px}
.brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:950;letter-spacing:2px}.brandmark{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,#ffb64e,#ff6e55);box-shadow:0 5px 18px #ff784533;font-size:17px}
.tag{font-size:10px;font-weight:850;letter-spacing:1.3px;color:#d4c6ff;background:#a18aff16;border:1px solid #b8a4ff35;border-radius:999px;padding:8px 11px}
.stage{display:flex;justify-content:center;align-items:center}
.frame{position:relative;overflow:hidden;border-radius:30px;border:1px solid #ffffff2a;background:#15152b;box-shadow:0 30px 90px #0009,0 0 0 5px #ffffff05,0 0 55px #a18aff0b;aspect-ratio:9/16;height:min(76svh,760px);width:auto;margin:auto}
#game{width:100%;height:100%;touch-action:none}#game canvas{display:block;width:100%!important;height:100%!important;object-fit:contain}
.foot{display:flex;justify-content:space-between;gap:12px;margin:12px 4px 0;color:#8987a8;font-size:10px}.foot span:last-child{text-align:right}
@media(max-width:600px){html,body{width:100%;height:100%;min-height:100%;overflow:hidden}body{display:block;padding:0;background:#101020}.shell{width:100%;height:100svh;max-width:none}.header,.foot{display:none}.stage{width:100%;height:100%;display:block}.frame{width:100%;height:100%;max-height:none;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}#game,#game canvas{width:100%!important;height:100%!important}}
@media(max-height:650px) and (orientation:landscape) and (min-width:601px){body{padding:6px}.shell{width:auto;height:100svh}.frame{height:calc(100svh - 78px);width:auto;aspect-ratio:9/16;max-height:none}.header,.foot{display:none}}
</style>
</head>
<body>
<main class="shell">
<header class="header"><div class="brand"><span class="brandmark">✦</span><span>FRUIT <span style="color:#ffad66">RUSH</span></span></div><span class="tag">ARCADE MODE</span></header>
<div class="stage">
<div class="frame"><div id="game" aria-label="Fruit Rush Android game preview"></div></div>
</div>
<footer class="foot"><span>✦ Fruit Rush Arcade</span><span>Best score is saved on this device</span></footer>
</main>
<script>
(()=> {
const W=390,H=690;
const fruits=[
 {e:"🍉",c:0xff5d75,p:10},{e:"🍊",c:0xffa44d,p:10},{e:"🍋",c:0xffdf63,p:15},
 {e:"🍏",c:0x8de58c,p:10},{e:"🍇",c:0xb69aff,p:15},{e:"🥝",c:0x9bd65a,p:15},
 {e:"🍓",c:0xff789e,p:20},{e:"🍍",c:0xffc85c,p:20}
];
class Rush extends Phaser.Scene{
 constructor(){super("rush");this.mode="home";this.score=0;this.lives=3;this.seconds=60;this.best=Number(localStorage.getItem("fruitCutterBest")||0);this.items=[];this.soundOn=true;this.combo=0;this.comboEnd=0;this.swiping=false;}
 create(){
  this.drawBg();this.hud=this.add.container(0,0).setDepth(20);this.ui=this.add.container(0,0).setDepth(30);this.trail=this.add.graphics().setDepth(25);
  this.buildHud();
  this.input.on("pointerdown",p=>{if(this.mode==="playing"){this.swiping=true;this.prev={x:p.x,y:p.y};this.points=[{x:p.x,y:p.y,t:this.time.now}]}});
  this.input.on("pointermove",p=>{if(!this.swiping||this.mode!=="playing")return;const a=this.prev;this.prev={x:p.x,y:p.y};this.points.push({x:p.x,y:p.y,t:this.time.now});if(a)this.cut(a.x,a.y,p.x,p.y)});
  this.input.on("pointerup",()=>this.swiping=false);this.input.on("gameout",()=>this.swiping=false);
  this.home();
 }
 drawBg(){
  const g=this.add.graphics();g.fillGradientStyle(0x251b46,0x171b3d,0x101a30,0x101a30,1);g.fillRect(0,0,W,H);
  g.fillStyle(0xffa45b,.09);g.fillCircle(330,190,120);g.fillStyle(0x9b8aff,.08);g.fillCircle(35,420,140);
  // Distant forest silhouettes create depth without hiding the fruit.
  g.fillStyle(0x263956,.45);
  for(let i=0;i<11;i++){const x=i*43-15,base=H-16,h=100+(i*37)%100;g.fillTriangle(x-38,base,x,base-h,x+38,base);g.fillTriangle(x-30,base-35,x,base-h-25,x+30,base-35)}
  // Midground leafy trees, intentionally darker than the play field.
  for(let i=0;i<8;i++){
   const side=i%2===0, x=side?18+(i%3)*14:W-18-(i%3)*14, base=H-20-(i%3)*10, scale=.72+(i%3)*.13;
   g.fillStyle(0x342e55,.72);g.fillRect(x-4*scale,base-76*scale,8*scale,80*scale);
   g.fillStyle(i%2?0x315c58:0x3a665d,.54);
   g.fillCircle(x,base-87*scale,25*scale);g.fillCircle(x-17*scale,base-73*scale,18*scale);g.fillCircle(x+18*scale,base-72*scale,19*scale);
   g.fillStyle(0x83bd8c,.10);g.fillCircle(x-7*scale,base-94*scale,10*scale);
  }
  // Foreground grass line along the bottom edge.
  g.fillStyle(0x23483f,.42);g.fillEllipse(W/2,H+16,440,82);
  g.fillStyle(0x5b9b67,.25);
  for(let i=0;i<34;i++){const x=i*12-5,y=H-3-(i%4)*3;g.fillTriangle(x-5,y,x,y-10-(i%3)*3,x+5,y)}
  for(let i=0;i<52;i++){g.fillStyle(i%3?0xffffff:0xffd9a1,.07+(i%4)*.025);g.fillCircle((i*71+19)%W,(i*137+25)%H,i%5===0?2:1)}
  g.lineStyle(1,0xffffff,.025);for(let y=150;y<H;y+=44)g.lineBetween(0,y,W,y);
 }
 txt(x,y,s,size,color="#fff",weight="800",origin=.5){return this.add.text(x,y,s,{fontFamily:"system-ui",fontSize:size+"px",fontStyle:weight,color,align:"center",lineSpacing:5,wordWrap:{width:310}}).setOrigin(origin)}
 buildHud(){
  this.hud.add(this.txt(20,20,"SCORE",10,"#aaa6ce","900",0));this.scoreTxt=this.txt(20,35,"000",30,"#ffffff","900",0);this.hud.add(this.scoreTxt);
  const card=this.add.graphics();card.fillStyle(0xffffff,.07);card.fillRoundedRect(142,25,106,48,15);card.lineStyle(1,0xffffff,.1);card.strokeRoundedRect(142,25,106,48,15);this.hud.add(card);
  this.livesTxt=this.txt(195,49,"♥ ♥ ♥",16,"#ff819e","900");this.hud.add(this.livesTxt);
  this.timeTxt=this.txt(370,35,"60",28,"#ffe6b1","900",1);this.hud.add(this.timeTxt);this.hud.add(this.txt(370,20,"TIME",10,"#aaa6ce","900",1));
  this.pauseBtn=this.makeButton(338,92,48,34,"Ⅱ",()=>this.pause(),true);this.hud.add(this.pauseBtn);
 }
 makeButton(x,y,w,h,label,fn,quiet=false){
  const c=this.add.container(x,y),g=this.add.graphics();g.fillStyle(quiet?0xffffff:0xffa65c,quiet?.09:1);g.fillRoundedRect(-w/2,-h/2,w,h,quiet?11:15);g.lineStyle(1,quiet?0xffffff:0xffd49a,quiet?.18:.8);g.strokeRoundedRect(-w/2,-h/2,w,h,quiet?11:15);
  const t=this.txt(0,0,label,quiet?16:16,quiet?"#e8e2ff":"#321a26","900");c.add([g,t]);c.setSize(w,h);c.setInteractive(new Phaser.Geom.Rectangle(-w/2,-h/2,w,h),Phaser.Geom.Rectangle.Contains);c.on("pointerover",()=>c.setScale(1.04));c.on("pointerout",()=>c.setScale(1));c.on("pointerdown",()=>{this.tweens.add({targets:c,scale:.95,duration:65,yoyo:true});fn()});return c;
 }
 clearUi(){this.ui.removeAll(true)}
 home(){
  this.mode="home";this.hud.setVisible(false);this.clearUi();
  // Hero panel: deliberate hierarchy, clear call to action, compact game promise.
  const hero=this.add.graphics();hero.fillStyle(0x090f25,.28);hero.fillRoundedRect(22,74,346,555,26);hero.lineStyle(1,0xffffff,.09);hero.strokeRoundedRect(22,74,346,555,26);this.ui.add(hero);
  const badge=this.add.graphics();badge.fillStyle(0x8fe0b7,.12);badge.fillRoundedRect(119,91,152,27,13);badge.lineStyle(1,0x9dffcc,.25);badge.strokeRoundedRect(119,91,152,27,13);this.ui.add(badge);
  this.ui.add(this.txt(195,104,"✦  FOREST ARCADE EDITION",9,"#b9ffd8","900"));
  this.ui.add(this.txt(195,151,"READY TO",13,"#c5b5ff","900"));
  this.ui.add(this.txt(195,190,"SLICE?",46,"#ffffff","950"));
  this.ui.add(this.txt(195,222,"Fresh fruit. Fast reflexes. Big combos.",11,"#c2c7e4","600"));
  // Fruit showcase with subtle colored halos.
  const fruitRow=this.add.container(195,294);const emojis=["🍉","🍊","🍓","🍍","🥝"];emojis.forEach((e,i)=>{const x=(i-2)*58;const halo=this.add.circle(x,0,25,[0xff6c83,0xffad55,0xff8aa7,0xffcc63,0x9de477][i],.17);const rim=this.add.circle(x,0,29,0xffffff,0).setStrokeStyle(1,0xffffff,.12);const t=this.txt(x,0,e,38);fruitRow.add([halo,rim,t]);this.tweens.add({targets:[halo,t],y:"-=6",duration:750+i*100,yoyo:true,repeat:-1,ease:"Sine.inOut",delay:i*80})});this.ui.add(fruitRow);
  const panel=this.add.graphics();panel.fillStyle(0xffffff,.055);panel.fillRoundedRect(52,345,286,66,17);panel.lineStyle(1,0xffffff,.11);panel.strokeRoundedRect(52,345,286,66,17);this.ui.add(panel);
  this.ui.add(this.txt(195,362,"PERSONAL BEST",9,"#aaa6ce","900"));this.ui.add(this.txt(195,389,String(this.best).padStart(4,"0"),24,"#ffe3ad","900"));
  this.ui.add(this.makeButton(195,468,270,56,"▶   START SLICING",()=>this.start()));
  this.ui.add(this.makeButton(195,536,270,44,"HOW TO PLAY",()=>this.how(),true));
  this.ui.add(this.txt(195,594,"60 SEC   ·   3 LIVES   ·   COMBO MULTIPLIERS",9,"#a4a0c6","800"));
  this.ui.add(this.txt(195,614,"SWIPE THROUGH FRUIT  •  AVOID BOMBS",8,"#737da4","700"));
 }
 how(){
  this.clearUi();
  const card=this.add.graphics();card.fillStyle(0x090f25,.35);card.fillRoundedRect(22,100,346,500,24);card.lineStyle(1,0xffffff,.1);card.strokeRoundedRect(22,100,346,500,24);this.ui.add(card);
  this.ui.add(this.txt(195,143,"QUICK START",10,"#b9ffd8","900"));
  this.ui.add(this.txt(195,178,"HOW TO PLAY",27,"#ffffff","950"));
  const rows=[["🍊","SLICE FRUIT","Drag your mouse through fruit to score."],["⚡","CHAIN COMBOS","Slice quickly to multiply your points."],["💣","AVOID BOMBS","A bomb costs one of your three lives."],["❤️","BEAT THE CLOCK","Score as much as you can in 60 seconds."]];
  rows.forEach((r,i)=>{const y=235+i*70,g=this.add.graphics();g.fillStyle(0xffffff,.055);g.fillRoundedRect(43,y-23,304,56,14);g.lineStyle(1,0xffffff,.06);g.strokeRoundedRect(43,y-23,304,56,14);this.ui.add(g);this.ui.add(this.txt(69,y+3,r[0],23));this.ui.add(this.txt(102,y-7,r[1],11,"#ffcc91","900",0));this.ui.add(this.txt(102,y+12,r[2],9,"#b6b1d4","500",0))});
  this.ui.add(this.makeButton(195,548,260,50,"LET'S PLAY",()=>this.start()));
  this.ui.add(this.makeButton(195,608,260,38,"BACK",()=>this.home(),true));
 }
 start(){
  this.clearUi();this.hud.setVisible(true);this.mode="playing";this.score=0;this.lives=3;this.seconds=60;this.combo=0;this.comboEnd=0;this.swiping=false;
  this.items.forEach(o=>o.destroy());this.items=[];this.updateHud();
  if(this.timer)this.timer.remove();if(this.spawner)this.spawner.remove();
  this.timer=this.time.addEvent({delay:1000,loop:true,callback:()=>{if(this.mode!=="playing")return;this.seconds--;this.updateHud();if(this.seconds<=0)this.end("TIME'S UP") }});
  this.spawner=this.time.addEvent({delay:850,loop:true,callback:()=>{if(this.mode==="playing")this.spawn()}});
  this.spawn();
 }
 updateHud(){this.scoreTxt.setText(String(this.score).padStart(3,"0"));this.livesTxt.setText(this.lives?"♥ ".repeat(this.lives).trim():"—");this.timeTxt.setText(String(this.seconds).padStart(2,"0"));this.timeTxt.setColor(this.seconds<=10?"#ff8097":"#ffe6b1")}
 spawn(){
  const n=Phaser.Math.Between(3,5),center=Phaser.Math.Between(70,320);
  for(let i=0;i<n;i++){const bomb=Math.random()<.13,f=bomb?{e:"💣",c:0x454052,p:0}:Phaser.Utils.Array.GetRandom(fruits),x=Phaser.Math.Clamp(center+Phaser.Math.Between(-95,95),32,358),y=H+40+Phaser.Math.Between(0,65);
   const o=this.add.container(x,y).setDepth(5),glow=this.add.circle(0,0,28,f.c,.16),emoji=this.add.text(0,0,f.e,{fontFamily:"system-ui",fontSize:bomb?"43px":"45px"}).setOrigin(.5);o.add([glow,emoji]);o.setSize(55,55);o.setData({bomb,p:f.p,c:f.c,r:26,sliced:false});o.vx=Phaser.Math.Between(-100,100);o.vy=Phaser.Math.Between(-850,-690);o.spin=Phaser.Math.Between(-3,3);this.items.push(o);
  }
 }
 cut(x1,y1,x2,y2){
  this.trail.clear();this.trail.lineStyle(5,0xffd69c,.9);this.trail.beginPath();this.trail.moveTo(x1,y1);this.trail.lineTo(x2,y2);this.trail.strokePath();this.trail.lineStyle(14,0xff9d73,.12);this.trail.beginPath();this.trail.moveTo(x1,y1);this.trail.lineTo(x2,y2);this.trail.strokePath();
  const dx=x2-x1,dy=y2-y1,len=dx*dx+dy*dy||1;
  for(const o of [...this.items]){if(!o.active||o.getData("sliced"))continue;const t=Phaser.Math.Clamp(((o.x-x1)*dx+(o.y-y1)*dy)/len,0,1);if(Phaser.Math.Distance.Between(o.x,o.y,x1+t*dx,y1+t*dy)<o.getData("r")+12)this.slice(o)}
 }
 slice(o){
  if(!o.active||o.getData("sliced"))return;o.setData("sliced",true);
  if(o.getData("bomb")){this.cameras.main.shake(170,.009);this.cameras.main.flash(100,255,60,100,.2);this.lives=Math.max(0,this.lives-1);this.pop(o.x,o.y,"BOMB!","#ff819e");this.updateHud();if(!this.lives)this.end("BOMBS GOT YOU");}
  else{this.combo=this.time.now<this.comboEnd?this.combo+1:1;this.comboEnd=this.time.now+700;const mult=this.combo>=4?3:this.combo>=2?2:1,pts=o.getData("p")*mult;this.score+=pts;this.updateHud();this.pop(o.x,o.y,(mult>1?"COMBO ×"+mult+"  ":"+")+pts,mult>1?"#b8ffbe":"#ffffff");
   for(let i=0;i<10;i++){const p=this.add.circle(o.x,o.y,Phaser.Math.Between(2,5),o.getData("c"),.95).setDepth(15);this.tweens.add({targets:p,x:p.x+Phaser.Math.Between(-52,52),y:p.y+Phaser.Math.Between(-55,45),alpha:0,scale:.1,duration:360,onComplete:()=>p.destroy()})}
  }
  this.tweens.add({targets:o,scale:.15,alpha:0,angle:Phaser.Math.Between(-90,90),duration:125,onComplete:()=>o.destroy()});
 }
 pop(x,y,s,color){const t=this.txt(x,y,s,16,color,"950").setDepth(18);t.setStroke("#17132b",4);this.tweens.add({targets:t,y:y-48,alpha:0,duration:650,onComplete:()=>t.destroy()})}
 pause(){
  if(this.mode==="playing"){this.mode="paused";this.swiping=false;if(this.timer)this.timer.paused=true;if(this.spawner)this.spawner.paused=true;this.clearUi();this.ui.add(this.txt(195,270,"TAKE A BREATHER",26,"#fff","950"));this.ui.add(this.txt(195,315,"Your fruit isn't going anywhere.\nProbably.",13,"#bdb7dc","500"));this.ui.add(this.makeButton(195,390,250,54,"▶  RESUME",()=>{this.mode="playing";this.clearUi();this.timer.paused=false;this.spawner.paused=false}));this.ui.add(this.makeButton(195,455,250,44,"RESTART ROUND",()=>this.start(),true));this.ui.add(this.makeButton(195,510,250,44,"QUIT TO HOME",()=>{this.timer.remove();this.spawner.remove();this.home()},true))}
 }
 end(reason){
  if(this.mode!=="playing")return;this.mode="over";this.swiping=false;if(this.timer)this.timer.remove();if(this.spawner)this.spawner.remove();if(this.score>this.best){this.best=this.score;localStorage.setItem("fruitCutterBest",String(this.best))}
  this.hud.setVisible(false);this.clearUi();this.ui.add(this.txt(195,165,reason,12,"#ffbf87","950"));this.ui.add(this.txt(195,205,"SWEET SCORE!",30,"#fff","950"));this.ui.add(this.txt(195,275,String(this.score).padStart(3,"0"),62,"#ffcb8b","950"));
  const panel=this.add.graphics();panel.fillStyle(0xffffff,.06);panel.fillRoundedRect(45,340,300,74,17);panel.lineStyle(1,0xffffff,.1);panel.strokeRoundedRect(45,340,300,74,17);this.ui.add(panel);this.ui.add(this.txt(195,361,"PERSONAL BEST",10,"#aaa6ce","900"));this.ui.add(this.txt(195,390,String(this.best).padStart(3,"0"),24,"#c9ffbf","950"));
  this.ui.add(this.makeButton(195,475,270,56,"↻   PLAY AGAIN",()=>this.start()));this.ui.add(this.makeButton(195,545,270,46,"BACK TO HOME",()=>this.home(),true));this.ui.add(this.txt(195,620,"ONE MORE ROUND? WE KNEW IT.",10,"#8f8bb4","800"));
 }
 update(time,delta){
  if(this.mode==="playing"){const dt=Math.min(delta/1000,.04);for(const o of [...this.items]){if(!o.active)continue;o.vy+=760*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.rotation+=o.spin*dt;if(o.y>H+90){this.items=this.items.filter(a=>a!==o);o.destroy()}}}
  this.trail.clear();if(this.swiping&&this.points&&this.points.length>1){const pts=this.points.filter(p=>time-p.t<120);this.points=pts;if(pts.length>1){this.trail.lineStyle(4,0xffd69c,.6);this.trail.beginPath();this.trail.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)this.trail.lineTo(pts[i].x,pts[i].y);this.trail.strokePath()}}
 }
}
new Phaser.Game({type:Phaser.AUTO,parent:"game",width:W,height:H,backgroundColor:"#17152b",scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},input:{activePointers:1},render:{antialias:true},scene:[Rush]});
})();
</script>
</body>
</html>
